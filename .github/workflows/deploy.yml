name: Deploy Rift docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stable_rift_ref:
        description: Rift tag or commit to publish as stable (defaults to the latest release)
        required: false
  repository_dispatch:
    types: [rift-release, rift-main-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out docs
        uses: actions/checkout@v4

      - name: Resolve stable Rift ref
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.stable_rift_ref }}
          EVENT_TYPE: ${{ github.event.action }}
          EVENT_REF: ${{ github.event.client_payload.rift_ref }}
        run: |
          ref="$INPUT_REF"
          if [[ -z "$ref" && "$EVENT_TYPE" == "rift-release" ]]; then
            ref="$EVENT_REF"
          fi
          if [[ -z "$ref" ]]; then
            ref="$(gh api repos/acsandmann/rift/releases/latest --jq .tag_name)"
          fi
          if [[ -z "$ref" ]]; then
            echo "Unable to resolve the latest Rift release." >&2
            exit 1
          fi
          echo "rift_ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve latest Rift ref
        id: latest
        env:
          EVENT_TYPE: ${{ github.event.action }}
          EVENT_REF: ${{ github.event.client_payload.rift_ref }}
        run: |
          ref="main"
          if [[ "$EVENT_TYPE" == "rift-main-updated" && -n "$EVENT_REF" ]]; then
            ref="$EVENT_REF"
          fi
          echo "rift_ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out stable Rift source
        uses: actions/checkout@v4
        with:
          repository: acsandmann/rift
          ref: ${{ steps.stable.outputs.rift_ref }}
          path: rift-stable

      - name: Check out latest Rift source
        uses: actions/checkout@v4
        with:
          repository: acsandmann/rift
          ref: ${{ steps.latest.outputs.rift_ref }}
          path: rift-latest

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build stable documentation
        env:
          RIFT_ROOT: ${{ github.workspace }}/rift-stable
          RIFT_REF: ${{ steps.stable.outputs.rift_ref }}
          SITE_BASE: /rift-docs
        run: |
          bun run check
          bun run build
          mv dist site

      - name: Build latest documentation
        env:
          RIFT_ROOT: ${{ github.workspace }}/rift-latest
          RIFT_REF: main
          SITE_BASE: /rift-docs/latest
        run: |
          bun run check
          bun run build
          bun run rewrite-base -- /rift-docs/ /rift-docs/latest/
          mkdir -p site/latest
          cp -R dist/. site/latest/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
